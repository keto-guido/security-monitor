# Copy this file to config.yaml and edit to match your cameras:
#   copy config.example.yaml config.yaml
#
# Reboot: set type so Esc → Options → Reboot cameras can restart the device.
#   ubiquiti = SSH reboot    reolink/amcrest/dahua = HTTP reboot
#   reboot: false skips a camera. Optional ssh_port / http_port.

display:
  # Grid of camera tiles. Default is 2x2 (4 cameras).
  columns: 2
  rows: 2
  cell_width: 640
  cell_height: 360
  # How frames are fitted into a tile: fit (letterbox), fill (crop), stretch
  scale_mode: fit
  window_title: Security Monitor
  fullscreen: false
  show_labels: true
  show_fps: true
  # Target UI refresh rate. Camera capture runs independently.
  fps: 25
  reconnect_seconds: 5
  # tcp is usually more reliable through routers/NAT; udp is lower latency.
  default_transport: tcp
  # Open/read timeouts for FFmpeg-backed streams (milliseconds).
  open_timeout_ms: 8000
  read_timeout_ms: 5000
  # Linux: optional xrandr orientation (normally leave as none).
  # screen_rotate: none       # none | normal | left | right | inverted
  # screen_output: auto       # auto | HDMI-1 | DP-1 | ...
  # Smooth playback delay (menu: Esc → Video settings). Off by default.
  smooth_buffer: false
  smooth_buffer_seconds: 1.0
  # Rolling history for quick rewind (, / . keys, L = live). Off by default.
  rewind_buffer: false
  rewind_buffer_seconds: 30
  # Snapshots (s) and clips (c). Menu: Esc → Capture.
  # save_directory: ~/security-monitor/captures
  snapshot_format: jpg          # jpg | png
  clip_seconds: 15
  # Detection masters (also enable per camera below / in Esc → Detection).
  people_detection: false
  object_detection: false
  # Auto snapshot + pre/during/post clip when a person appears (Esc → Detection).
  auto_person_capture: false
  person_pre_roll_seconds: 5
  person_post_roll_seconds: 5
  person_max_event_seconds: 120
  # Auto-erase unlocked captures/events (0 = off). Lock items in the browser to keep them.
  capture_retention_days: 14
  capture_max_gb: 20
  # Auto-advance focused camera (Esc → Cameras → Cycle focus). Off by default.
  cycle_focus: false
  cycle_focus_seconds: 10

cameras:
  - name: Front Door
    url: rtsp://192.168.1.10:554/Streaming/Channels/101
    enabled: true
    type: ubiquiti
    # detect_people: false
    # detect_objects: false
    # rotate: 180             # clockwise degrees if the camera is mounted upside-down
    # username: camera
    # password: secret
    # ssh_port: 22

  - name: Driveway
    url: rtsp://192.168.1.11:554/stream1
    enabled: true
    type: ubiquiti
    transport: tcp

  - name: Backyard
    url: rtsp://192.168.1.12:554/live
    enabled: true
    type: reolink
    # http_port: 80

  - name: Garage
    url: rtsp://192.168.1.13:554/h264
    enabled: true
    type: ubiquiti

  # Extra cameras are ignored unless you raise columns * rows.
  # Local webcam (useful for testing the mosaic):
  # - name: Webcam
  #   device: 0
  #   enabled: true
  #
  # Local file:
  # - name: Playback
  #   url: C:/path/to/clip.mp4
  #   enabled: true
