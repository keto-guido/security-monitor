[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-monitor"
version = "0.2.0"
description = "Command-line multi-camera RTSP/RTP viewer for Windows and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Security Monitor" }]
keywords = ["rtsp", "rtp", "ip-camera", "nvr", "opencv", "detection"]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "paramiko>=3.4",
    "requests>=2.31",
    "ultralytics>=8.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
security-monitor = "security_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
security_monitor = ["data/config.example.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
